{% extends "base.html" %}

{% block title %}Journal - MindMate{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>
                    <i class="fas fa-journal-whills me-3 text-primary"></i>
                    My Journal
                </h1>
                <div>
                    <a href="/dashboard" class="btn btn-outline-primary me-2">
                        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                    </a>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newEntryModal">
                        <i class="fas fa-plus me-2"></i>New Entry
                    </button>
                </div>
            </div>
            
            <!-- Journal entries will be loaded here -->
            <div id="journal-entries">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- New Entry Modal -->
<div class="modal fade" id="newEntryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">New Journal Entry</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="newEntryForm">
                    <div class="mb-3">
                        <label for="content" class="form-label">How are you feeling today?</label>
                        <textarea class="form-control" id="content" rows="5" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="mood" class="form-label">Mood</label>
                        <select class="form-select" id="mood">
                            <option value="">Select your mood (optional)</option>
                            <option value="happy">😊 Happy</option>
                            <option value="sad">😢 Sad</option>
                            <option value="anxious">😰 Anxious</option>
                            <option value="calm">😌 Calm</option>
                            <option value="angry">😠 Angry</option>
                            <option value="excited">🎉 Excited</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tags" class="form-label">Tags (comma-separated)</label>
                        <input type="text" class="form-control" id="tags" placeholder="work, family, health">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createEntry()">Save Entry</button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadEntries() {
    try {
        const response = await fetch('/api/entries/');
        if (response.status === 401) {
            window.location.replace('/login');
            return;
        }
        if (!response.ok) throw new Error('Failed to load entries');
        const entries = await response.json();
        displayEntries(entries);
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('journal-entries').innerHTML = `
            <div class="alert alert-danger">
                Failed to load entries. Please try again.
            </div>
        `;
    }
}

function displayEntries(entries) {
    const container = document.getElementById('journal-entries');
    
    if (entries.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="fas fa-journal-whills fa-4x text-muted mb-3"></i>
                <h3>No entries yet</h3>
                <p class="text-muted">Start your journaling journey today!</p>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newEntryModal">
                    <i class="fas fa-plus me-2"></i>Create Your First Entry
                </button>
            </div>
        `;
        return;
    }
    
    container.innerHTML = entries.map(entry => `
        <div class="card mb-4 card-shadow">
            <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
                <div>
                    <i class="fas fa-calendar me-2 text-primary"></i>
                    ${new Date(entry.created_at).toLocaleDateString('en-US', {
                        weekday: 'long',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}
                </div>
                <div>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteEntry(${entry.id})">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="card-body">
                <p class="card-text">${entry.content}</p>
                ${entry.mood ? `
                    <span class="badge bg-primary me-2">
                        <i class="fas fa-smile me-1"></i>${entry.mood}
                    </span>
                ` : ''}
                ${entry.tags ? entry.tags.split(',').map(tag => `
                    <span class="badge bg-secondary me-1">#${tag.trim()}</span>
                `).join('') : ''}
            </div>
        </div>
    `).join('');
}

async function createEntry() {
    const content = document.getElementById('content').value;
    const mood = document.getElementById('mood').value;
    const tags = document.getElementById('tags').value;
    
    if (!content) {
        alert('Please write something in your entry');
        return;
    }
    
    try {
        const response = await fetch('/api/entries/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                content: content,
                mood: mood,
                tags: tags
            })
        });
        
        if (response.ok) {
            // Close modal and refresh entries
            bootstrap.Modal.getInstance(document.getElementById('newEntryModal')).hide();
            document.getElementById('newEntryForm').reset();
            loadEntries();
        } else {
            const data = await response.json();
            alert(data.detail || 'Failed to create entry');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred');
    }
}

async function deleteEntry(id) {
    if (!confirm('Are you sure you want to delete this entry?')) return;
    
    try {
        const response = await fetch(`/api/entries/${id}`, {
            method: 'DELETE'
        });
        
        if (response.ok) {
            loadEntries();
        } else {
            alert('Failed to delete entry');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('An error occurred');
    }
}

// Load entries on page load
document.addEventListener('DOMContentLoaded', () => {
    loadEntries();
});
</script>

<style>
.card-shadow {
    box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
}
</style>
{% endblock %}
