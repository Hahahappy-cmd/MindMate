[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmate"
version = "1.0.0"
description = "A privacy-conscious mental wellness journal with sentiment and emotion analytics."
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi==25.1.0",
  "alembic==1.19.1",
  "email-validator==2.3.0",
  "fastapi==0.129.0",
  "jinja2==3.1.6",
  "numpy==2.4.2",
  "passlib==1.7.4",
  "pydantic-settings==2.12.0",
  "python-jose[cryptography]==3.5.0",
  "python-multipart==0.0.22",
  "psycopg[binary]==3.3.5",
  "redis==8.1.0",
  "rq==2.12.0",
  "scikit-learn==1.9.0",
  "sqlalchemy==2.0.46",
  "textblob==0.19.0",
  "uvicorn[standard]==0.40.0",
]

[project.optional-dependencies]
worker = ["torch==2.13.0", "transformers==4.57.6"]
dev = ["httpx==0.28.1", "pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "frontend/templates/*.html",
  "frontend/static/css/*.css",
  "frontend/static/js/*.js",
  "nlp/fixtures/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: requires the downloaded transformer model", "integration: requires real external test services"]
